# Starship — Nord + trilho spacial (Termux, 04/09)
# Linha 1: ╭╴ [user nord10] [path nord9] [git nord8] ──fill── hora (fim da linha)
# Linha 2: ╰╴❯  (onde se digita — ╭ e ╰ conectam as duas linhas)
# Estrutura de blocos derivada do preset catppuccin-powerline; cores Nord.
# Sem glifos decorativos (so powerline E0B0 + box-drawing) — render robusto.

add_newline = false

format = """
[╭╴](fg:#4C566A)\
$username\
[](fg:#5E81AC bg:#81A1C1)\
$directory\
[](fg:#81A1C1 bg:#88C0D0)\
$git_branch\
$git_status\
[](fg:#88C0D0)\
$fill\
$time\
$line_break\
[╰╴](fg:#4C566A)[❯](bold #A3BE8C)"""

[fill]
symbol = "─"
style = "fg:#4C566A"

[username]
show_always = true
style_user = "bg:#5E81AC fg:#2E3440"
style_root = "bg:#5E81AC fg:#2E3440"
format = "[ $user ]($style)"

[os]
disabled = true

[directory]
style = "bg:#81A1C1 fg:#2E3440"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bg:#88C0D0 fg:#2E3440"
format = "[ $branch ]($style)"
only_attached = true

[git_status]
style = "bg:#88C0D0 fg:#2E3440"
format = "[$all_status$ahead_behind]($style)"
conflicted = "="
staged = "+"
modified = "!"
deleted = "✗"
renamed = "→"
untracked = "?"
ahead = " ↑"
behind = " ↓"
diverged = " ⇕"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#4C566A bold"
format = "[ $time ]($style)"

[hostname]
disabled = true

[cmd_duration]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true
